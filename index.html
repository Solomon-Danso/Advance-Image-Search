<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageMatch | Visual Search</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #9ca3af;
            --gray-light: #f3f4f6;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark);
            background-color: #f8fafc;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: linear-gradient(120deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px 0;
            box-shadow: var(--shadow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo i {
            font-size: 1.8rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            padding: 5px 10px;
            border-radius: 4px;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        nav a.active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--dark);
            position: relative;
            padding-bottom: 10px;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--secondary);
        }

        .btn-secondary:hover {
            background-color: #0d9669;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: var(--transition);
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--primary);
        }

        .upload-area i {
            font-size: 3rem;
            color: var(--gray);
            margin-bottom: 15px;
        }

        .upload-area h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .upload-area p {
            color: var(--gray);
        }

        #image-preview {
            display: none;
            max-width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .result-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .result-content {
            padding: 15px;
        }

        .result-id {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .result-similarity {
            display: inline-block;
            background: var(--secondary);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .result-meta {
            font-size: 0.9rem;
            color: var(--gray);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: white;
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
            box-shadow: var(--shadow);
            transform: translateX(100%);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
        }

        .notification.error {
            border-left-color: #ef4444;
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
            color: var(--gray);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            nav ul {
                gap: 15px;
            }
            
            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .upload-area {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .card {
                padding: 20px;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-images"></i>
                    <span>ImageMatch</span>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html" class="active">Search</a></li>
                        <li><a href="admin.html">Admin Dashboard</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <h2>Visual Search</h2>
        
        <div class="card">
            <div class="card-title">
                <i class="fas fa-search"></i>
                Upload Query Image
            </div>
            
            <div class="upload-area" id="drop-zone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>Drag & Drop your image here</h3>
                <p>or click to browse files</p>
                <input type="file" id="file-input" style="display: none;" accept="image/*">
            </div>
            
            <img id="image-preview" alt="Image preview">
            
            <button class="btn" id="search-btn">
                <i class="fas fa-search"></i>
                Search Similar Images
            </button>
        </div>
        
        <div class="card">
            <div class="card-title">
                <i class="fas fa-list"></i>
                Search Results
            </div>
            
            <div class="results-grid" id="results-container">
                <!-- Results will be displayed here -->
            </div>
        </div>
    </main>

    <div class="notification" id="notification">
        Operation completed successfully!
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023 ImageMatch Visual Search System | Powered by TensorFlow.js & MySQL</p>
        </div>
    </footer>

    <script>
        // API base URL
        const API_BASE = 'http://localhost:9002';

        // File upload handling for search tab
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const imagePreview = document.getElementById('image-preview');
        
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                }
                
                reader.readAsDataURL(this.files[0]);
            }
        });
        
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = 'var(--primary)';
            this.style.backgroundColor = 'var(--gray-light)';
        });
        
        dropZone.addEventListener('dragleave', function() {
            this.style.borderColor = 'var(--border)';
            this.style.backgroundColor = 'transparent';
        });
        
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = 'var(--border)';
            this.style.backgroundColor = 'transparent';
            
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                fileInput.files = e.dataTransfer.files;
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                }
                
                reader.readAsDataURL(e.dataTransfer.files[0]);
            }
        });

        // Search functionality
        document.getElementById('search-btn').addEventListener('click', async function() {
            if (!fileInput.files.length) {
                showNotification('Please upload an image first', true);
                return;
            }
            
            // Show loading state
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
            this.disabled = true;
            
            try {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);
                
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                console.log('Search response:', data);
                if (data.success) {
                    displayResults(data.results);
                    showNotification('Search completed successfully!');
                } else {
                    showNotification(data.error || 'Search failed', true);
                }
            } catch (error) {
                console.log('Search error:', error);
                showNotification('Error connecting to server', true);
            } finally {
                // Reset button
                this.innerHTML = '<i class="fas fa-search"></i> Search Similar Images';
                this.disabled = false;
            }
        });

        // Display search results
        function displayResults(results) {
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '';
            
            if (!results || results.length === 0) {
                resultsContainer.innerHTML = '<p>No similar designs found</p>';
                return;
            }
            
            results.forEach(result => {
                const similarityPercent = (result.similarity * 100).toFixed(1);
                const metadata = typeof result.metadata === 'string' 
                    ? result.metadata 
                    : JSON.stringify(result.metadata);
                
                const resultCard = document.createElement('div');
                resultCard.className = 'result-card';
                
                // Use actual image if available, otherwise use placeholder
                const imageHtml = result.image_url 
                    ? `<img src="${API_BASE}${result.image_url}" class="result-img" alt="${result.id}" onerror="this.style.display='none'; this.parentNode.innerHTML += '<div class=\'result-img-placeholder\' style=\'width: 100%; height: 180px; background: #f3f4f6; display: flex; align-items: center; justify-content: center;\'><i class=\'fas fa-shirt\' style=\'font-size: 3rem; color: #9ca3af;\'></i></div>'">`
                    : `<div class="result-img-placeholder" style="width: 100%; height: 180px; background: #f3f4f6; display: flex; align-items: center; justify-content: center;"><i class="fas fa-shirt" style="font-size: 3rem; color: #9ca3af;"></i></div>`;
                
                resultCard.innerHTML = `
                    ${imageHtml}
                    <div class="result-content">
                    
                        <div class="result-similarity">${similarityPercent}% match</div>
                    </div>
                `;
                
                resultsContainer.appendChild(resultCard);
            });
        }

        // Show notification
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.remove('error');
            
            if (isError) {
                notification.classList.add('error');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
