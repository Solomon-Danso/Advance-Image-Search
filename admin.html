<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageMatch | Admin Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #9ca3af;
            --gray-light: #f3f4f6;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark);
            background-color: #f8fafc;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: linear-gradient(120deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px 0;
            box-shadow: var(--shadow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo i {
            font-size: 1.8rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            padding: 5px 10px;
            border-radius: 4px;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        nav a.active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--dark);
            position: relative;
            padding-bottom: 10px;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 4px;
            background: var(--primary);
            border-radius: 2px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--secondary);
        }

        .btn-secondary:hover {
            background-color: #0d9669;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: var(--transition);
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--primary);
        }

        .upload-area i {
            font-size: 3rem;
            color: var(--gray);
            margin-bottom: 15px;
        }

        .upload-area h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .upload-area p {
            color: var(--gray);
        }

        #admin-image-preview {
            display: none;
            max-width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .designs-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .designs-table th, .designs-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .designs-table th {
            background-color: var(--gray-light);
            font-weight: 600;
        }

        .designs-table tr:hover {
            background-color: var(--gray-light);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: white;
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
            box-shadow: var(--shadow);
            transform: translateX(100%);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
        }

        .notification.error {
            border-left-color: #ef4444;
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
            color: var(--gray);
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            nav ul {
                gap: 15px;
            }
            
            .upload-area {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-images"></i>
                    <span>ImageMatch</span>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Search</a></li>
                        <li><a href="admin.html" class="active">Admin Dashboard</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <h2>Admin Dashboard</h2>
        
        <div class="card">
            <div class="card-title">
                <i class="fas fa-upload"></i>
                Index New Design
            </div>
            
            <form id="upload-form">
               
                
                <div class="upload-area" id="admin-drop-zone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>Drag & Drop design image here</h3>
                    <p>or click to browse files</p>
                    <input type="file" id="admin-file-input" style="display: none;" accept="image/*" required>
                </div>
                
                <img id="admin-image-preview" alt="Image preview">
                
                <button type="submit" class="btn btn-secondary">
                    <i class="fas fa-database"></i>
                    Index Design
                </button>
            </form>
        </div>
        
        <div class="card">
            <div class="card-title">
                <i class="fas fa-table"></i>
                Indexed Designs
            </div>
            
            <button class="btn" id="refresh-designs">
                <i class="fas fa-sync-alt"></i>
                Refresh Designs
            </button>
            
            <table class="designs-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                       
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="designs-table-body">
                    <!-- Design data will be populated here -->
                </tbody>
            </table>
        </div>
    </main>

    <div class="notification" id="notification">
        Operation completed successfully!
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2023 ImageMatch Visual Search System | Powered by TensorFlow.js & MySQL</p>
        </div>
    </footer>

    <script>
        // API base URL
        const API_BASE = 'http://localhost:9002';

        // File upload handling for admin tab
        const adminDropZone = document.getElementById('admin-drop-zone');
        const adminFileInput = document.getElementById('admin-file-input');
        const adminImagePreview = document.getElementById('admin-image-preview');
        
        adminDropZone.addEventListener('click', () => {
            adminFileInput.click();
        });
        
        adminFileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    adminImagePreview.src = e.target.result;
                    adminImagePreview.style.display = 'block';
                }
                
                reader.readAsDataURL(this.files[0]);
            }
        });
        
        adminDropZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = 'var(--primary)';
            this.style.backgroundColor = 'var(--gray-light)';
        });
        
        adminDropZone.addEventListener('dragleave', function() {
            this.style.borderColor = 'var(--border)';
            this.style.backgroundColor = 'transparent';
        });
        
        adminDropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = 'var(--border)';
            this.style.backgroundColor = 'transparent';
            
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                adminFileInput.files = e.dataTransfer.files;
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    adminImagePreview.src = e.target.result;
                    adminImagePreview.style.display = 'block';
                }
                
                reader.readAsDataURL(e.dataTransfer.files[0]);
            }
        });

        // Form submission for indexing
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent default form submission
            
            
            if (!adminFileInput.files.length) {
                showNotification('Please upload an image first', true);
                return;
            }
            
            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Indexing...';
            submitBtn.disabled = true;
            
            try {
                const formData = new FormData();
                formData.append('image', adminFileInput.files[0]);
                
               
                
                const response = await fetch(`${API_BASE}/index`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Reset form
                    this.reset();
                    adminImagePreview.style.display = 'none';
                    
                    // Reload designs table
                    loadDesigns();
                    
                    showNotification('Design indexed successfully!');
                } else {
                    showNotification(data.error || 'Indexing failed', true);
                }
            } catch (error) {
                console.log('Indexing error:', error);
                showNotification('Error connecting to server', true);
            } finally {
                // Reset button
                submitBtn.innerHTML = '<i class="fas fa-database"></i> Index Design';
                submitBtn.disabled = false;
                  loadDesigns();
            }
        });

        // Refresh designs button
        document.getElementById('refresh-designs').addEventListener('click', loadDesigns);

        // Load designs
        async function loadDesigns() {
            const tableBody = document.getElementById('designs-table-body');
            const refreshBtn = document.getElementById('refresh-designs');
            
            refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            refreshBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/designs`);
                const data = await response.json();

                
                if (data.success) {
                    tableBody.innerHTML = '';
                    
                    if (data.designs.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No designs indexed yet</td></tr>';
                    } else {
                        data.designs.forEach(design => {
                            const row = document.createElement('tr');
                            const metadata = typeof design.metadata === 'string' 
                                ? design.metadata 
                                : JSON.stringify(design.metadata);

                            row.innerHTML = `
                                <td>${design.id}</td>
                                <td>
                                    <img src="${API_BASE}${design.image_url}" 
                                         alt="design-${design.id}" 
                                         style="width:80px; height:80px; object-fit:cover; border-radius:6px;"
                                         onerror="this.src='https://via.placeholder.com/80?text=No+Img'">
                                </td>
                               
                                <td>${new Date(design.created_at).toLocaleString()}</td>
                                <td>
                                    <button class="btn btn-danger delete-btn" data-id="${design.id}" style="padding: 5px 10px; font-size: 0.8rem;">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            `;
                            
                            tableBody.appendChild(row);
                        });
                        
                        // Delete button events
                        document.querySelectorAll('.delete-btn').forEach(btn => {
                            btn.addEventListener('click', function() {
                                const designId = this.getAttribute('data-id');
                                deleteDesign(designId);
                            });
                        });
                    }
                }
            } catch (error) {
                console.log('Error loading designs:', error);
                showNotification('Error loading designs', true);
            } finally {
                refreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh Designs';
                refreshBtn.disabled = false;
            }
        }

        // Delete a design
        async function deleteDesign(designId) {
            if (!confirm(`Are you sure you want to delete design ${designId}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/designs/${designId}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('Design deleted successfully');
                    loadDesigns(); // Reload the table
                } else {
                    showNotification(data.error || 'Failed to delete design', true);
                }
            } catch (error) {
                console.log('Delete design error:', error);
                showNotification('Error connecting to server', true);
            }
        }

        // Show notification
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.remove('error');
            
            if (isError) {
                notification.classList.add('error');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Load designs on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadDesigns();
        });
    </script>
</body>
</html>
